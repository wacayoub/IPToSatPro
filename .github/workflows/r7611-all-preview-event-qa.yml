name: R76.11 All Preview Event Codes — Read-only QA
on:
  push:
    branches: [release/r769-finalization-20261014]
    paths:
      - scripts/audit_r7611_preview_all_events_readonly.py
      - scripts/test_r7611_preview_all_events.py
      - .github/workflows/r7611-all-preview-event-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate 18-char event truncation and private-safe read-only reporting
        run: |
          python -m py_compile scripts/audit_r7611_preview_all_events_readonly.py scripts/test_r7611_preview_all_events.py
          python -m unittest discover -s scripts -p test_r7611_preview_all_events.py -v
