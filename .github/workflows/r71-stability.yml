name: IPToSatPro R71 Stability CI
on:
  push:
    branches: [feature/r71-stability]
    paths:
      - 'scripts/*r71*'
      - '.github/workflows/r71-stability.yml'
      - 'docs/r71*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Audit REAL released matching and player source
        run: python3 scripts/audit_r71_focus.py
      - name: Verify inherited matching baseline
        run: python3 scripts/test_r70_preview_logic.py
      - name: Build R71 BETA + execute actual 22-channel regression suite
        run: |
          python3 -m unittest discover -s scripts -p 'test_r71_stability.py' -v
          python3 scripts/build-r71-beta.py
          python3 scripts/check_locked_fast_guard.py r71-beta.ipk
          python3 -m py_compile scripts/build-r71-beta.py scripts/test_r71_stability.py
      - name: Upload R71 candidate only after green tests
        uses: actions/upload-artifact@v4
        with:
          name: iptosatpro-r71-beta-NOT-field-validated
          path: r71-beta.ipk
          retention-days: 14
      - name: Ensure production release stays R70
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('update.json').read_text())
          assert x['version']=='1.0.46-r70-final'
          print('PRODUCTION_R70_NOT_MODIFIED')
          PY
