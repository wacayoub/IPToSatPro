name: R7416 UNMAP and FTA Crypto Icons Regression
on:
  push:
    branches: [fix/r7416-unmap-fta-crypted-icons]
  workflow_dispatch:
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Compile guarded hotfix and test actual R74 package
        run: |
          python3 -m py_compile scripts/r7416_unmap_fta_crypt_icons.py
          python3 -m unittest discover -s scripts -p test_r7416_unmap_crypto.py -v
      - name: Legacy 74 Preview behavior regression
        run: |
          python3 -m unittest discover -s scripts -p test_r7415_firstpaint_green.py -v
          python3 -m unittest discover -s scripts -p test_r7414_fast_candidates_manual_lock.py -v
          python3 -m unittest discover -s scripts -p test_r7413_preview_inline.py -v
      - name: Do not publish production update
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          version=str(json.loads(Path('update.json').read_text()).get('version',''))
          assert 'r70' in version.lower(), version
          print("PRODUCTION_UNMODIFIED",version)
          PY
