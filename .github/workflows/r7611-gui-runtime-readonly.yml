name: R76.11 GUI Process Restart Diagnostic (read-only)
on:
  push:
    branches: [release/r769-finalization-20261014]
    paths:
      - scripts/audit_r7611_gui_runtime_readonly.py
      - scripts/test_r7611_gui_runtime.py
      - .github/workflows/r7611-gui-runtime-readonly.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Enigma2 start vs install timestamp without receiver mutations
        run: |
          python -m py_compile scripts/audit_r7611_gui_runtime_readonly.py scripts/test_r7611_gui_runtime.py
          python -m unittest discover -s scripts -p test_r7611_gui_runtime.py -v
