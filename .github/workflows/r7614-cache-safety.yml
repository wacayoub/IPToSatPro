name: R76.14 Preview Bounded Cache Safety (no install)
on:
  push:
    branches: [release/r769-finalization-20261014]
    paths:
      - scripts/r7614_preview_cache_patch.py
      - scripts/test_r7614_preview_cache.py
      - .github/workflows/r7614-cache-safety.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install Pillow
      - name: Verify byte-identical function bodies and bounded parser caching
        run: |
          python -m py_compile scripts/r7614_preview_cache_patch.py scripts/test_r7614_preview_cache.py
          python -m unittest discover -s scripts -p test_r7614_preview_cache.py -v
