name: R76 Metrix Home + Neo Preview B Acceptance
on:
  push:
    branches: [feature/r76-metrix-home-preview-b]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native-enigma2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deterministic build dependencies
        run: python -m pip install Pillow
      - name: Compile R76 code
        run: python -m py_compile scripts/r76_metrix_preview_layout.py scripts/build-r76-metrix-preview.py scripts/r763_preview_fast_medal_patch.py scripts/r764_multi_seed_patch.py scripts/r765_token_postings_patch.py scripts/test_r76_metrix_preview.py scripts/test_r764_multi_seed.py scripts/test_r765_postings.py
      - name: Validate receiver deployment scripts and staging compiler
        run: |
          sh -n download-r76-beta.sh
          python -m py_compile scripts/stage-r76-metrix.py scripts/r76_receiver_smoke.py
      - name: Verify FHD and HD Enigma2 XML widgets
        run: python scripts/r76_metrix_preview_layout.py
      - name: Rebuild real R76 IPK and run software acceptance
        run: python -m unittest discover -s scripts -p test_r76_metrix_preview.py -v
      - name: Probe actual R76 Python exec and UI initialization
        run: python scripts/r76_exec_probe.py
      - name: Investigate candidate ranking and rendering (source-only)
        run: python scripts/r763_candidate_probe.py
      - name: R76.4 real one-source-cache regression (24 providers / 13k keys)
        run: python -m unittest discover -s scripts -p test_r764_multi_seed.py -v
      - name: Probe actual catalog index and cache hot paths
        run: python scripts/r765_cache_probe.py
      - name: R76.5 45k-index and protected-core regression
        run: python -m unittest discover -s scripts -p test_r765_postings.py -v
      - name: R75 smart-index regression
        run: python -m unittest discover -s scripts -p test_r75_smart_index.py -v
      - name: R75 classic palette regression
        run: python -m unittest discover -s scripts -p test_r75_neo_classic_palette.py -v
      - name: Rebuild IPK and save byte verified package
        run: |
          mkdir -p staging-output
          python scripts/build-r76-metrix-preview.py staging-output/iptosatpro-r76-metrix-preview-b-beta.ipk | tee staging-output/build-info.json.log
          sha256sum staging-output/iptosatpro-r76-metrix-preview-b-beta.ipk > staging-output/SHA256SUMS
      - name: Upload QA beta (NOT a production release)
        uses: actions/upload-artifact@v4
        with:
          name: r76-metrix-preview-b-qa-ipk
          path: staging-output/
          retention-days: 14
      - name: Stage verified R76 beta to feature branch only
        run: |
          python scripts/stage-r76-metrix.py
          python - <<'PY'
          import base64,hashlib,json,pathlib
          manifest=json.loads(pathlib.Path("staging/r76-metrix-preview.update.json").read_text())
          payload=base64.b64decode(pathlib.Path("payload/r76-metrix-preview.b64").read_bytes())
          assert hashlib.sha256(payload).hexdigest()==manifest["sha256"]
          assert manifest["production_published"] is False and manifest["receiver_tested"] is False
          assert manifest["version"]=="1.0.46-r76.5-postings-fast-preview-beta"
          print("R76_DEPLOYMENT_PIN_VALID")
          PY
          git add payload/r76-metrix-preview.b64 staging/r76-metrix-preview.update.json
          if ! git diff --cached --quiet; then
            git -c user.name='IPToSatPro CI' -c user.email='actions@users.noreply.github.com' \
                commit -m 'stage(r76): checksum-pinned HD/FHD Metrix beta package [skip ci]'
            git push origin HEAD:feature/r76-metrix-home-preview-b
          fi
