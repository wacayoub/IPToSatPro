name: R76.11 Cache vs Preview Log Trace (Read-only)
on:
  push:
    branches: [release/r769-finalization-20261014]
    paths:
      - scripts/audit_r7611_preview_trace_readonly.py
      - scripts/test_r7611_preview_trace.py
      - .github/workflows/r7611-preview-trace-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify cache-skip reasoning, log events and secret redaction
        run: |
          python -m py_compile scripts/audit_r7611_preview_trace_readonly.py scripts/test_r7611_preview_trace.py
          python -m unittest discover -s scripts -p test_r7611_preview_trace.py -v
