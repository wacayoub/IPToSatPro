name: R72.5 Fuzzy Failover Audit
on:
  push:
    branches: [feature/r725-fuzzy-no-signal-stability]
    paths:
      - '.github/workflows/r725-fuzzy.yml'
      - 'scripts/audit-r725-fuzzy.py'
      - 'scripts/build-r725-fuzzy.py'
      - 'scripts/test_r725_fuzzy.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit installed R72.4 matching and repeated tune-fail flow
        run: python3 scripts/audit-r725-fuzzy.py
      - name: Validate interrupted fuzzy job, no-match cooldown and intact Fast Zap
        run: |
          set -eu
          python3 -m unittest discover -s scripts -p 'test_r725_fuzzy.py' -v
          python3 -m unittest discover -s scripts -p 'test_r724_zero_signal.py' -v
          python3 -m unittest discover -s scripts -p 'test_r71_stability.py' -v
          python3 scripts/build-r725-fuzzy.py
          python3 scripts/check_locked_fast_guard.py r725-fuzzy-stability-beta.ipk
          python3 -m py_compile scripts/build-r725-fuzzy.py scripts/test_r725_fuzzy.py
      - name: Upload R72.5 beta after tests
        uses: actions/upload-artifact@v4
        with:
          name: iptosatpro-r725-fuzzy-stability-beta
          path: r725-fuzzy-stability-beta.ipk
          retention-days: 14
