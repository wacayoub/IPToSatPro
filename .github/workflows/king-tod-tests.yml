name: Experimental King TOD routing tests
on:
  push:
    branches:
      - feature/fast-zap-tod-king-v1
    paths:
      - 'experiments/**'
      - '.github/workflows/king-tod-tests.yml'
  pull_request:
    paths:
      - 'experiments/**'
      - '.github/workflows/king-tod-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile routing module
        run: python3 -m py_compile experiments/king_tod_router.py
      - name: Compile all isolated TOD modules
        run: python3 -m compileall -q experiments
      - name: Check isolated policy and blacklist behavior
        run: python3 -m unittest discover -s experiments -p 'test_*.py' -v
      - name: Assert this feature branch leaves released plugin unchanged
        run: |
          git fetch --no-tags --depth=1 origin main
          git diff --exit-code FETCH_HEAD HEAD -- \
            update.json latest-version.txt payload scripts \
            'download-*.sh'
      - name: Audit existing published r64-to-r69 LOCKED differences
        run: |
          if python3 scripts/check_locked_fast_guard.py; then
            echo "Published release matches field-proven r64 guard."
          else
            echo "::warning::Published r69-beta already differs from r64 guarded fast-start. Hardware approval required before TOD may be merged/released."
          fi
