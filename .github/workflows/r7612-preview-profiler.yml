name: R76.12 Preview Phase Profiler Beta (no receiver install)
on:
  push:
    branches: [release/r769-finalization-20261014]
    paths:
      - scripts/r7612_preview_stage_profile_patch.py
      - scripts/probe_r7612_hotpaths.py
      - scripts/build-r7612-preview-profile.py
      - scripts/test_r7612_preview_stage_profile.py
      - scripts/stage-r7612-preview-profile.py
      - download-r7612-profile-beta.sh
      - scripts/test_r7612_installer.py
      - .github/workflows/r7612-preview-profiler.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: r7612-preview-profiler-beta
  cancel-in-progress: true
jobs:
  verify-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install Pillow
      - name: Validate byte-identical matching, numeric-only timing and passive postinst
        run: |
          python -m py_compile scripts/r7612_preview_stage_profile_patch.py scripts/build-r7612-preview-profile.py scripts/test_r7612_preview_stage_profile.py
          python -m unittest discover -s scripts -p test_r7612_preview_stage_profile.py -v
      - name: Verify SHA-pinned R76.12 installer is no-op on repeated execution
        run: |
          sh -n download-r7612-profile-beta.sh
          python -m unittest discover -s scripts -p test_r7612_installer.py -v
      - name: Print actual R76.12 hot paths for profiling audit
        run: python scripts/probe_r7612_hotpaths.py
      - name: Preserve R76.11 normal Preview behavior
        run: |
          python -m unittest discover -s scripts -p test_r7611_preview_cold.py -v
          python -m unittest discover -s scripts -p test_r7611_idempotence.py -v
      - name: Confirm main production release untouched
        run: |
          python - <<'PY'
          import json
          assert json.load(open("update.json"))["version"]=="1.0.46-r70-final"
          print("R70_STABLE_MAIN_UNCHANGED")
          PY
      - name: Stage isolated profiling-only beta with SHA256
        run: |
          python scripts/stage-r7612-preview-profile.py
          python - <<'PY'
          import base64,hashlib,json,pathlib
          x=json.loads(pathlib.Path("staging/r7612-phase-profile.update.json").read_text())
          raw=base64.b64decode(pathlib.Path("payload/r7612-phase-profile.b64").read_bytes())
          assert x["sha256"]==hashlib.sha256(raw).hexdigest()
          assert x["size"]==len(raw)
          assert x["receiver_tested"] is False and x["production_published"] is False
          print("R7612_STAGE_VERIFIED",x["sha256"],x["size"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r7612-preview-phase-profiler-qa
          path: |
            staging/r7612-phase-profile.update.json
            payload/r7612-phase-profile.b64
          retention-days: 14
      - name: Commit staged beta ONLY to testing branch
        run: |
          git add staging/r7612-phase-profile.update.json payload/r7612-phase-profile.b64
          if ! git diff --cached --quiet; then
            git -c user.name="IPToSatPro CI" -c user.email="actions@users.noreply.github.com" commit -m "stage(r7612): phase profiler beta [skip ci]"
            git push origin HEAD:release/r769-finalization-20261014
          fi
