name: R80.1 read-only Vu+ cold Preview audit QA
on:
  push:
    branches: [feature/r80-preview-hotpath-20261015]
    paths:
      - scripts/audit_r801_receiver_readonly.py
      - scripts/test_r801_receiver_readonly.py
      - .github/workflows/r801-receiver-audit-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check audit syntax
        run: python -m py_compile scripts/audit_r801_receiver_readonly.py scripts/test_r801_receiver_readonly.py
      - name: Validate no receiver mutation and cold latency gates
        run: python -m unittest discover -s scripts -p test_r801_receiver_readonly.py -v
