name: R74 Unified Preview Beta
on:
  push:
    branches: [feature/r74-unified-preview-actual-bouquet]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  r74:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build actual R74 IPK and verify protected module equality
        run: python3 scripts/build-r74-unified.py /tmp/iptosatpro-r74-unified-beta.ipk
      - name: R74 actual bouquet, interface and navigation tests
        run: python3 -m unittest discover -s scripts -p 'test_r74_unified.py' -v
      - name: R74.3 encrypted NO-to-YES and FTA safety regressions
        run: python3 -m unittest discover -s scripts -p 'test_r743_crypto_first_zap.py' -v
      - name: R74.4 no-signal and two-second FTA to encrypted policy regression
        run: python3 -m unittest discover -s scripts -p 'test_r744_fast_signal.py' -v
      - name: R74.5 fast cached No Signal under 1 second and recovery safety regressions
        run: python3 -m unittest discover -s scripts -p 'test_r745_nosignal_fast.py' -v
      - name: R74.6 LOCKED black screen versus real DVB video regression
        run: python3 -m unittest discover -s scripts -p 'test_r746_locked_black.py' -v
      - name: R74.7 first Preview lock-seed fully expands all server candidates
        run: python3 -m unittest discover -s scripts -p 'test_r747_initial_preview.py' -v
      - name: R74.8 SAT country names versus IPTV code prefixes and safety regression
        run: python3 -m unittest discover -s scripts -p 'test_r748_country_codes.py' -v
      - name: Regression for 20261012-170137 Enigma2 crash on zero-arg Preview close
        run: python3 -m unittest discover -s scripts -p 'test_r742_preview_close.py' -v
      - name: Safe Auto Play and Preview backward regression
        run: |
          python3 -m unittest discover -s scripts -p 'test_r738_auto_open.py' -v
          python3 -m unittest discover -s scripts -p 'test_r736_automap.py' -v
          python3 -m unittest discover -s scripts -p 'test_r737_video_visible.py' -v
          python3 -m unittest discover -s scripts -p 'test_r73_20_matches.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: iptosatpro-r74-unified-preview-beta
          path: /tmp/iptosatpro-r74-unified-beta.ipk
          retention-days: 14
      - name: Publish verified beta payload to branch only
        run: |
          sh -n download-r74-beta.sh
          base64 -w0 /tmp/iptosatpro-r74-unified-beta.ipk > payload/r74-unified-preview.b64
          python3 -c 'import hashlib,json,pathlib; p=pathlib.Path("/tmp/iptosatpro-r74-unified-beta.ipk"); b=p.read_bytes(); m={"version":"1.0.46-r74.8-country-code-matcher-beta","size":len(b),"sha256":hashlib.sha256(b).hexdigest(),"beta":True,"receiver_tested":False,"production_published":False}; pathlib.Path("staging/r74-unified-preview.update.json").write_text(json.dumps(m,indent=2))'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add payload/r74-unified-preview.b64 staging/r74-unified-preview.update.json
          if git diff --cached --quiet; then
            echo "R74 beta already staged"
          else
            git commit -m "ci: stage checksum-verified R74 beta [skip ci]"
            git push origin HEAD:feature/r74-unified-preview-actual-bouquet
          fi
