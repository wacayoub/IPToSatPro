name: Stage R72.2 TV Polish Beta
on:
  push:
    branches: [feature/r72-2-tv-polish]
    paths:
      - '.github/workflows/stage-r722-tv-polish.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: r722-tv-polish-stage
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Test native R72.2 source safety and screenshot fixes
        run: |
          set -eu
          python3 -m unittest discover -s scripts -p 'test_r722_tv_polish.py' -v
          python3 scripts/build-r722-tv-polish.py
          echo 'fdfa391b6ead34b27977be9e9592b60be7a50247bbe45a2a2645e3a5488bdfb1  r722-tv-polish-beta.ipk' | sha256sum -c -
          python3 scripts/check_locked_fast_guard.py r722-tv-polish-beta.ipk
      - name: Stage safe verified R72.2 download
        run: |
          set -eu
          python3 scripts/stage-r722-tv-polish.py
          sh -n download-r722-tv-polish.sh
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json
          manifest=json.loads(Path('staging/r722-tv-polish.update.json').read_text())
          blob=base64.b64decode(Path('payload/r722-tv-polish.b64').read_bytes())
          assert len(blob)==manifest['size']==359174
          assert hashlib.sha256(blob).hexdigest()==manifest['sha256']
          assert not manifest['receiver_tested'] and not manifest['production_published']
          assert json.loads(Path('update.json').read_text())['version']=='1.0.46-r70-final'
          print('R722_SAFE_STAGE_VERIFIED_MAIN_R70_UNTOUCHED')
          PY
      - name: Publish files only to R72.2 experimental branch
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payload/r722-tv-polish.b64 staging/r722-tv-polish.update.json download-r722-tv-polish.sh
          if git diff --cached --quiet; then
            echo 'R72.2 already staged'
          else
            git commit -m 'Stage checksum verified R72.2 TV polish beta'
            git push origin HEAD:feature/r72-2-tv-polish
          fi
