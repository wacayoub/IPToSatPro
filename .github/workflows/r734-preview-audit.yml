name: R73.4 Preview First Open and Resolution Audit
on:
  push:
    branches: [feature/r734-instant-preview-resolution]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read real packaged Preview startup and decoder evidence code
        run: python3 scripts/audit_r734_ui_measure.py
