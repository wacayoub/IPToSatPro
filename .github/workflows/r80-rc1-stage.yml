name: R80 Finalization RC1 — Candidate & Package Gate
on:
  push:
    branches: [release/r769-finalization-20261014]
    paths:
      - scripts/r80_index_focus_patch.py
      - scripts/test_r80_index_focus.py
      - scripts/test_r80_rc1_packaging.py
      - scripts/build-r80-rc1-index-focus.py
      - scripts/stage-r80-rc1.py
      - .github/workflows/r80-rc1-stage.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: iptosat-r80-final-rc1
  cancel-in-progress: true
jobs:
  verify-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install Pillow
      - name: Candidate scoring/ranking parity and real lazy-guard tests
        run: |
          python -m unittest discover -s scripts -p test_r80_index_focus.py -v
          python -m unittest discover -s scripts -p test_r7615_preview_index.py -v
      - name: R80 package non-regression tests
        run: python -m unittest discover -s scripts -p test_r80_rc1_packaging.py -v
      - name: Stable production remains unchanged
        run: |
          python - <<'PY'
          import json
          assert json.load(open("update.json"))["version"] == "1.0.46-r70-final"
          print("R70_STABLE_RELEASE_UNMODIFIED")
          PY
      - name: Stage verified isolated RC1
        run: |
          python scripts/stage-r80-rc1.py
          python - <<'PY'
          import base64,hashlib,json
          m=json.load(open("staging/r80-rc1-index-focus.update.json"))
          raw=base64.b64decode(open("payload/r80-rc1-index-focus.b64","rb").read())
          assert m["size"] == len(raw)
          assert m["sha256"] == hashlib.sha256(raw).hexdigest()
          assert m["beta"] and not m["receiver_tested"] and not m["production_published"]
          print("R80_RC1_STAGED_HASHED",m["size"],m["sha256"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r80-rc1-index-focus-tested
          path: |
            staging/r80-rc1-index-focus.update.json
            payload/r80-rc1-index-focus.b64
          retention-days: 14
      - name: Commit only staging payload, never push main
        run: |
          git add staging/r80-rc1-index-focus.update.json payload/r80-rc1-index-focus.b64
          if ! git diff --cached --quiet; then
            git -c user.name='IPToSatPro CI' -c user.email='actions@users.noreply.github.com' commit -m 'stage(r80): RC1 index candidate [skip ci]'
            git push origin HEAD:release/r769-finalization-20261014
          fi
