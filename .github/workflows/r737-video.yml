name: R73.7 Real Video Preview
on:
  push:
    branches: [feature/r737-video-visible-preview]
  workflow_dispatch:
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test real video visibility and guaranteed UI return
        run: |
          python3 -m unittest discover -s scripts -p test_r737_video_visible.py -v
          python3 -m unittest discover -s scripts -p test_r736_automap.py -v
          python3 -m unittest discover -s scripts -p test_r73_20_matches.py -v
      - name: Protect playback and stable updater
        run: |
          python3 scripts/build-r73-preview.py
          python3 scripts/check_locked_fast_guard.py r737-visible-video-preview-beta.ipk
          python3 - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path("update.json").read_text())['version']=='1.0.46-r70-final'
          print("R737_STABLE_UNTOUCHED")
          PY
