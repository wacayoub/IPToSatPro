name: R72.7 Playback latency audit
on:
  push:
    branches: [feature/r727-fast-playback-audit]
    paths:
      - '.github/workflows/r727-fast.yml'
      - 'scripts/audit-r727-playback.py'
      - 'scripts/audit-r727-focused.py'
      - 'scripts/build-r727-fast.py'
      - 'scripts/test_r727_fast.py'
      - 'scripts/r727-speed-audit.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact shipped playback and slow fallback paths
        run: |
          python3 scripts/audit-r727-focused.py
      - name: Test exact R72.7 fuzzy cache and unchanged playback
        run: |
          set -eu
          python3 -m unittest discover -s scripts -p 'test_r727_fast.py' -v
          python3 -m unittest discover -s scripts -p 'test_r726_safe_match.py' -v
          python3 -m unittest discover -s scripts -p 'test_r725_fuzzy.py' -v
          python3 -m unittest discover -s scripts -p 'test_r71_stability.py' -v
          python3 scripts/build-r727-fast.py
          python3 scripts/check_locked_fast_guard.py r727-fuzzy-cache-beta.ipk
          python3 -m py_compile scripts/build-r727-fast.py scripts/test_r727_fast.py
      - name: Check read-only receiver speed diagnostics against observed log examples
        run: python3 scripts/r727-speed-audit.py --self-test
      - name: Upload beta candidate only after checks
        uses: actions/upload-artifact@v4
        with:
          name: iptosatpro-r727-fuzzy-cache-beta
          path: r727-fuzzy-cache-beta.ipk
          retention-days: 14
