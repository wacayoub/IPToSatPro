name: R73.3 Realistic 24k Candidate Benchmark
on:
  push:
    branches: [feature/r733-turbo-candidate-index]
    paths: ['.github/workflows/bench-r733.yml']
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare identical indexed feeds (known-present numbers) at 24000 streams
        run: python3 scripts/bench_r732_candidates.py
