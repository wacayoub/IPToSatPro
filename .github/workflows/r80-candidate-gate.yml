name: R80 RC1 — Release Freeze and Verified Stage
on:
  push:
    branches: [release/r80-final-candidate-20261015]
    paths:
      - scripts/build-r80-final-rc1.py
      - scripts/test_r80_release_candidate.py
      - scripts/stage-r80-final-rc1.py
      - .github/workflows/r80-candidate-gate.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: r80-final-rc1-stage
  cancel-in-progress: true
jobs:
  verify-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Verify precise original engine and all settings-byte parity
        run: |
          python -m py_compile scripts/build-r80-final-rc1.py scripts/test_r80_release_candidate.py scripts/stage-r80-final-rc1.py
          python -m unittest discover -s scripts -p test_r80_release_candidate.py -v
      - name: Preserve R76.15 Preview nominee parity and R76.14 rank
        run: |
          python -m unittest discover -s scripts -p test_r7615_preview_index.py -v
          python -m unittest discover -s scripts -p test_r7615_packaging.py -v
      - name: Stable public production remains unchanged
        run: |
          python - <<'PY'
          import json
          assert json.load(open('update.json'))['version']=='1.0.46-r70-final'
          print('PRODUCTION_NOT_PROMOTED')
          PY
      - name: Verify R80 nonproduction manifest and SHA
        run: |
          python scripts/stage-r80-final-rc1.py
          python - <<'PY'
          import base64,hashlib,json
          m=json.load(open('staging/r80-final-rc1.update.json'))
          raw=base64.b64decode(open('payload/r80-final-rc1.b64','rb').read())
          assert len(raw)==m['size']
          assert hashlib.sha256(raw).hexdigest()==m['sha256']
          assert m['source_sha256']=='c3991af773c6700c1aac0652f5027b27b4e1a91ff0820bf25e801e8d8488c468'
          assert m['beta'] and not m['production_published'] and not m['receiver_tested'] and not m['index_target_met']
          print('R80_RC1_SHA_VERIFIED',m['size'],m['sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iptosatpro-r80-rc1-nonproduction
          path: |
            staging/r80-final-rc1.update.json
            payload/r80-final-rc1.b64
          retention-days: 14
      - name: Stage only in R80 branch
        run: |
          git add staging/r80-final-rc1.update.json payload/r80-final-rc1.b64
          if ! git diff --cached --quiet; then
            git -c user.name='IPToSatPro CI' -c user.email='actions@users.noreply.github.com' commit -m 'stage(r80): frozen release candidate [skip ci]'
            git push origin HEAD:release/r80-final-candidate-20261015
          fi
