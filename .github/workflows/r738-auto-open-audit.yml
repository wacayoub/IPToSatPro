name: R73.8 Auto Play Beta CI
on:
  push:
    branches: [feature/r738-auto-open-on-safe-match]
  workflow_dispatch:
jobs:
  build-and-regress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build R73.8 staged IPK and verify immutable player/monitor
        run: python3 scripts/build-r738-auto-open.py /tmp/r738-safe-auto-play-beta.ipk
      - name: Auto play through real package and stale-zap regression
        run: python3 -m unittest discover -s scripts -p 'test_r738_auto_open.py' -v
      - name: Existing mapping and preview regression suites
        run: |
          python3 -m unittest discover -s scripts -p 'test_r736_automap.py' -v
          python3 -m unittest discover -s scripts -p 'test_r737_video_visible.py' -v
          python3 -m unittest discover -s scripts -p 'test_r73_20_matches.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: r738-safe-auto-play-beta
          path: /tmp/r738-safe-auto-play-beta.ipk
          retention-days: 7
