name: R73.8 Auto Play Beta CI
on:
  push:
    branches: [feature/r738-auto-open-on-safe-match]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-regress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build R73.8 staged IPK and verify immutable player/monitor
        run: python3 scripts/build-r738-auto-open.py /tmp/r738-safe-auto-play-beta.ipk
      - name: Auto play through real package and stale-zap regression
        run: python3 -m unittest discover -s scripts -p 'test_r738_auto_open.py' -v
      - name: Existing mapping and preview regression suites
        run: |
          python3 -m unittest discover -s scripts -p 'test_r736_automap.py' -v
          python3 -m unittest discover -s scripts -p 'test_r737_video_visible.py' -v
          python3 -m unittest discover -s scripts -p 'test_r73_20_matches.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: r738-safe-auto-play-beta
          path: /tmp/r738-safe-auto-play-beta.ipk
          retention-days: 7
      - name: Stage SHA256-verified opt-in beta on feature branch only
        run: |
          sh -n download-r738-safe-beta.sh
          base64 -w0 /tmp/r738-safe-auto-play-beta.ipk > payload/r738-safe-auto-play.b64
          python3 -c 'import json,hashlib,pathlib; p=pathlib.Path("/tmp/r738-safe-auto-play-beta.ipk"); b=p.read_bytes(); m={"version":"1.0.46-r73.8-safe-auto-play-beta","size":len(b),"sha256":hashlib.sha256(b).hexdigest(),"beta":True,"receiver_tested":False,"production_published":False}; pathlib.Path("staging/r738-safe-auto-play.update.json").write_text(json.dumps(m,indent=2))'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add payload/r738-safe-auto-play.b64 staging/r738-safe-auto-play.update.json
          if git diff --cached --quiet; then
            echo 'Beta payload already staged; no push necessary.'
          else
            git commit -m 'ci: stage verified R73.8 beta payload [skip ci]'
            git push origin HEAD:feature/r738-auto-open-on-safe-match
          fi
