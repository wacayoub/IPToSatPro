name: R75 Finalization - Read Only All Modules Audit
on:
  push:
    branches: [audit/r75-finalization-20261013]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-package-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test-only image dependency
        run: python3 -m pip install --quiet Pillow
      - name: Source compilation and actual R75 reproducible package checks
        run: |
          python3 -m py_compile scripts/final_r75_audit.py
          python3 scripts/final_r75_audit.py
      - name: Run one by one all past R70-R75 regression files
        run: |
          set -u
          count=0
          failed=""
          for f in scripts/test_r7*.py; do
            [ -f "$f" ] || continue
            echo "::group::REGRESSION $f"
            python3 -m unittest discover -s scripts -p "$(basename "$f")" -q
            rc=$?
            echo "::endgroup::"
            count=$((count+1))
            if [ "$rc" -ne 0 ]; then
              failed="$failed $(basename "$f")"
              echo "::warning file=$f::Historical regression test failed; continue remaining cases"
            fi
          done
          echo "TOTAL_TEST_FILES=$count"
          echo "FAILED_MODULES=$failed"
          test "$count" -ge 25
          test -z "$failed"
      - name: Publish report as retained CI artifact only (no production changes)
        uses: actions/upload-artifact@v4
        with:
          name: r75-final-module-audit
          path: staging/final-r75-audit.json
          retention-days: 30
