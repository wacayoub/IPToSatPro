name: R76.13 Preview Score Helper Forensics
on:
  push:
    branches: [release/r769-finalization-20261014]
    paths:
      - scripts/probe_r7613_cpu_helpers.py
      - .github/workflows/r7613-helper-forensics.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install Pillow
      - name: Inspect exact assembled R76.13 pure helpers
        run: python scripts/probe_r7613_cpu_helpers.py
