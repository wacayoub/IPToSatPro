name: Mapping Engine Deep Audit — NO IPK / NO RELEASE
on:
  push:
    branches:
      - audit/r70-rc7-mapping-root-cause
    paths:
      - 'r70/auto_recovery_rc7.py'
      - 'tests/test_mapping_root_causes.py'
      - 'tests/test_mapping_corpus_100.py'
      - 'tests/test_mapping_known_gaps.py'
      - 'r70/mapping_identity_audit_patch.py'
      - 'tests/test_mapping_identity_audit_patch.py'
      - 'scripts/receiver-explain-matches.sh'
      - 'tests/test_auto_recovery_rc7.py'
      - 'scripts/audit_mapping_100.py'
      - 'scripts/audit_legacy_r62_r69.py'
      - 'scripts/audit_legacy_regression_diffs.py'
      - 'audit/**'
      - '.github/workflows/audit-mapping-100.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Mapping core and Preview race regression tests
        run: |
          python3 -m unittest discover -s tests -p test_auto_recovery_rc7.py -v
          python3 -m unittest discover -s tests -p test_mapping_root_causes.py -v
      - name: 100 real native matching-score test scenarios
        run: python3 -m unittest discover -s tests -p test_mapping_corpus_100.py -v
      - name: Known real-world matching gaps (2 expected failures, no fake pass)
        run: python3 -m unittest discover -s tests -p test_mapping_known_gaps.py -v
      - name: Verify receiver diagnostic shell and embedded Python syntax
        run: |
          sh -n scripts/receiver-explain-matches.sh
          python3 - <<'PY'
          from pathlib import Path
          s=Path("scripts/receiver-explain-matches.sh").read_text()
          payload=s.split("python3 - <<'PY'\n",1)[1].rsplit("\nPY",1)[0]
          compile(payload,"receiver-explain-matches.py","exec")
          PY
      - name: Audited TREK and Tipik identity correction, plus original 100-case non-regression
        run: python3 -m unittest discover -s tests -p test_mapping_identity_audit_patch.py -v
      - name: Previous rc6 player, TOD audio, Preview and FTA regressions
        run: |
          for spec in test_no_signal_policy.py test_fta_runtime_rc3.py test_r70_safety.py test_r70_preview.py test_preview_autotest_rc4.py test_player_recovery_rc5.py test_tod_audio_rc6.py; do
            python3 -m unittest discover -s tests -p "$spec" -v
          done
      - name: Forensic comparison of real archived r53-r69 mapping engines
        run: python3 scripts/audit_legacy_r62_r69.py
      - name: Show critical Preview and monitor regression diffs from r65 through r68
        run: python3 scripts/audit_legacy_regression_diffs.py
      - name: Audit structure and 100-point issue matrix
        run: |
          python3 scripts/audit_mapping_100.py
      - name: Upload audit report ONLY (not a package)
        uses: actions/upload-artifact@v4
        with:
          name: mapping-audit-100-report
          path: |
            audit/MAPPING_100_RESULTS.md
            audit/MAPPING_100_RESULTS.csv
            audit/LEGACY_COMPARISON_R53_R69.json
          retention-days: 14
      - name: Freeze official update and shipping artifacts
        shell: bash
        run: |
          set -euo pipefail
          for f in update.json latest-version.txt download-latest.sh; do
            diff -u <(git show origin/main:"$f") "$f"
          done
          test ! -f r70-candidate.ipk
          echo 'AUDIT ONLY. No packaging, no release, no published online update.'

