name: R76.15 SHA-Pinned Installer QA (receiver unchanged)
on:
  push:
    branches: [release/r769-finalization-20261014]
    paths:
      - download-r7615-index-beta.sh
      - scripts/test_r7615_installer.py
      - .github/workflows/r7615-installer-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pinned package, proper baseline, safe backups and rollback
        run: |
          sh -n download-r7615-index-beta.sh
          python -m unittest discover -s scripts -p test_r7615_installer.py -v
