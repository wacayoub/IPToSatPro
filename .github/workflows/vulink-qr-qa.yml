name: VuLink Pro V2 Security QA
on:
  push:
    branches:
      - feature/vulink-pro-v2
    paths:
      - "vulink/**"
      - ".github/workflows/vulink-qr-qa.yml"
  workflow_dispatch:
jobs:
  offline-vulink:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify syntax and installer
        run: |
          python3 -m py_compile vulink/bridge.py vulink/plugin.py vulink/v2.py vulink/qrpng.py vulink/__init__.py
          sh -n vulink/install.sh
      - name: Test ephemeral LAN token, HTML pairing, expiry and privacy
        run: python3 -m unittest discover -s vulink/tests -p 'test_*.py' -v
      - name: Assert no release or remote execution integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          bridge=Path("vulink/bridge.py").read_text()
          assert 'ThreadingHTTPServer' in bridge
          assert 'secrets.choice' in bridge and 'TTL_SECONDS = 600' in bridge
          assert 'from .qrpng import write_qr_png' in bridge
          v2=Path('vulink/v2.py').read_text()
          assert 'class ProPairingServer(PairingServer)' in v2
          assert 'self.pair.decide(self._pending_id, True)' in Path('vulink/plugin.py').read_text()
          assert 'shell=True' not in v2
          assert 'os.system(' not in v2
          assert 'exec(' not in v2
          assert 'shell=True' not in bridge
          assert 'os.system(' not in bridge
          assert 'exec(' not in bridge
          assert 'FTP' not in bridge
          print('READ_ONLY_LOCAL_PAIRING_CHECK_PASS')
          PY
