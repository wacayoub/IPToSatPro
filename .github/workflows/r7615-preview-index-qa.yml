name: R76.15 Only Preview Nomination Index QA
on:
  push:
    branches: [release/r769-finalization-20261014]
    paths:
      - scripts/r7615_preview_index_patch.py
      - scripts/test_r7615_preview_index.py
      - .github/workflows/r7615-preview-index-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install Pillow
      - name: Same SAT IPTV candidate list, source order and per-server caps
        run: |
          python -m py_compile scripts/r7615_preview_index_patch.py scripts/test_r7615_preview_index.py
          python -m unittest discover -s scripts -p test_r7615_preview_index.py -v
