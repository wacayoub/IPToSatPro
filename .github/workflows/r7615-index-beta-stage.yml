name: R76.15 Nomination-Only Index Beta — Verify and Stage
on:
  push:
    branches: [release/r769-finalization-20261014]
    paths:
      - scripts/r7615_preview_index_patch.py
      - scripts/test_r7615_preview_index.py
      - scripts/test_r7615_packaging.py
      - scripts/build-r7615-preview-index.py
      - scripts/stage-r7615-preview-index.py
      - .github/workflows/r7615-index-beta-stage.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: r7615-index-only-beta
  cancel-in-progress: true
jobs:
  safety-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install Pillow
      - name: Test full candidate parity on 1000 providers and dense anchor buckets
        run: python -m unittest discover -s scripts -p test_r7615_preview_index.py -v
      - name: Test protected package assets and unchanged scorer functions
        run: python -m unittest discover -s scripts -p test_r7615_packaging.py -v
      - name: Preserve production update
        run: |
          python - <<'PY'
          import json
          assert json.load(open("update.json"))["version"]=="1.0.46-r70-final"
          print("STABLE_UNCHANGED")
          PY
      - name: Stage R76.15 isolated beta
        run: |
          python scripts/stage-r7615-preview-index.py
          python - <<'PY'
          import base64,hashlib,json
          m=json.load(open("staging/r7615-preview-index.update.json"))
          raw=base64.b64decode(open("payload/r7615-preview-index.b64","rb").read())
          assert m["size"]==len(raw)
          assert m["sha256"]==hashlib.sha256(raw).hexdigest()
          assert m["beta"] and not m["receiver_tested"] and not m["production_published"]
          print("R7615_SHA_SIZE_VERIFIED",m["sha256"],m["size"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r7615-index-only-beta
          path: |
            staging/r7615-preview-index.update.json
            payload/r7615-preview-index.b64
          retention-days: 14
      - name: Commit staged package to testing branch only
        run: |
          git add staging/r7615-preview-index.update.json payload/r7615-preview-index.b64
          if ! git diff --cached --quiet; then
            git -c user.name="IPToSatPro CI" -c user.email="actions@users.noreply.github.com" commit -m "stage(r7615): index-only beta [skip ci]"
            git push origin HEAD:release/r769-finalization-20261014
          fi
