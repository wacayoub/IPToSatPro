name: R7416 Final Guard API Audit
on:
  push:
    branches: [fix/r7416-unmap-fta-crypted-icons]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Inspect blue action and bulk automap
        run: |
          python3 - <<'PY'
          import ast,importlib.util,tempfile
          from pathlib import Path
          sp=importlib.util.spec_from_file_location('builder','scripts/build-r74-unified.py')
          b=importlib.util.module_from_spec(sp);sp.loader.exec_module(b)
          with tempfile.TemporaryDirectory() as td:
            f=Path(td)/"r74.ipk";b.build(f)
            pk=b.b.b.base.pack
            src=pk.members_from(pk.unpack_ar(f.read_bytes())["data.tar.gz"])[b.PLUGIN].decode()
            tr=ast.parse(src)
            wanted={'_commit_auto_scan_overrides','_lamedb_access_states','_blue_action','_r736_auto_map_single_sat','_load_manual_aliases','_save_override','_sat_status'}
            for n in ast.walk(tr):
              if isinstance(n,ast.FunctionDef) and n.name in wanted:
                print("METHOD_START",n.name)
                print(ast.get_source_segment(src,n)[:14500])
                print("METHOD_END",n.name)
          PY
