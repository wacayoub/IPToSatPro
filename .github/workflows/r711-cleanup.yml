name: R71.1 Visual Cleanup Audit and CI
on:
  push:
    branches: [feature/r711-neo-cleanup]
    paths:
      - 'scripts/*r711-cleanup*'
      - '.github/workflows/r711-cleanup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current Settings menu and theme mechanics
        run: python3 scripts/audit-r711-cleanup.py
