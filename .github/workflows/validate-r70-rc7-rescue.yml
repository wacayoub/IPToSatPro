name: Validate r70-rc7 Automatic Same-Channel Recovery (NO RELEASE)
on:
  push:
    branches:
      - feature/r70-rc7-auto-candidates
    paths:
      - 'r70/**'
      - 'scripts/build-r70-candidate.py'
      - 'scripts/check_r70_baseline.py'
      - 'scripts/receiver-build-r70-test.sh'
      - 'scripts/check_receiver_bootstrap_sources.py'
      - 'tests/test_fta_runtime_rc3.py'
      - 'tests/test_no_signal_policy.py'
      - 'tests/test_preview_autotest_rc4.py'
      - 'tests/test_player_recovery_rc5.py'
      - 'tests/test_tod_audio_rc6.py'
      - 'tests/test_auto_recovery_rc7.py'
      - '.github/workflows/validate-r70-rc7-rescue.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: FTA policy and live adapter tests
        run: |
          python3 -m unittest discover -s tests -p test_no_signal_policy.py -v
          python3 -m unittest discover -s tests -p test_fta_runtime_rc3.py -v
      - name: Prior rc2 playback and Preview non-regression tests
        run: |
          python3 -m unittest discover -s tests -p test_r70_safety.py -v
          python3 -m unittest discover -s tests -p test_r70_preview.py -v
      - name: Preview Auto-Test selection and failover regressions
        run: python3 -m unittest discover -s tests -p test_preview_autotest_rc4.py -v
      - name: Failed-player recovery unit tests
        run: python3 -m unittest discover -s tests -p test_player_recovery_rc5.py -v
      - name: TOD Event 4K and Event 1-14 audio-safe playback regressions
        run: python3 -m unittest discover -s tests -p test_tod_audio_rc6.py -v
      - name: Auto select safe alternatives after dead manual lock, stale-zap and REVIEW tests
        run: python3 -m unittest discover -s tests -p test_auto_recovery_rc7.py -v
      - name: Ensure receiver SSH bootstrap includes all rc7 modules
        run: |
          python3 scripts/check_receiver_bootstrap_sources.py
          sh -n scripts/receiver-build-r70-test.sh
      - name: Build rc7 locally and assert protected r69/rc2 code remains safe
        run: |
          python3 scripts/build-r70-candidate.py
          python3 scripts/check_r70_baseline.py
      - name: Verify candidate, version and updater hold
        shell: bash
        run: |
          set -euo pipefail
          test -s r70-candidate.ipk
          ar p r70-candidate.ipk control.tar.gz | tar -xzOf - ./control | grep -Fx 'Version: 1.0.46-r70-rc7'
          for filename in no_signal_policy.py fta_runtime_adapter.py r70_preview_async.py preview_autotest_rc4.py player_recovery_rc5.py tod_audio_recovery_rc6.py auto_recovery_rc7.py; do
            ar p r70-candidate.ipk data.tar.gz | tar -tzf - | grep -F "/SatIPTVBridge/$filename"
          done
          for file in update.json latest-version.txt download-latest.sh; do
            diff -u <(git show origin/main:"$file") "$file"
          done
          test ! -f payload/r70-rc7.b64
          echo 'PASS: auto-candidate search only after failed pinned playback and no official update.'
      - name: Keep short-lived RC7 test artifact (NOT A RELEASE)
        uses: actions/upload-artifact@v4
        with:
          name: iptosat-r70-rc7-TEST-ONLY
          path: r70-candidate.ipk
          retention-days: 3
          if-no-files-found: error
