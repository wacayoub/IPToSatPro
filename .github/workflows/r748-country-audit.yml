name: R74.8 Country Matcher Audit
on:
  push:
    branches: [feature/r74-unified-preview-actual-bouquet]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read real compiled matcher and country handling
        run: python3 scripts/audit_r748_country.py
