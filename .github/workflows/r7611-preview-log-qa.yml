name: R76.11 Preview Log Evidence QA (read-only)
on:
  push:
    branches: [release/r769-finalization-20261014]
    paths:
      - scripts/audit_r7611_preview_logs_readonly.py
      - scripts/test_r7611_preview_logs.py
      - .github/workflows/r7611-preview-log-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate read-only, private-safe zero-samples diagnostic
        run: |
          python -m py_compile scripts/audit_r7611_preview_logs_readonly.py scripts/test_r7611_preview_logs.py
          python -m unittest discover -s scripts -p test_r7611_preview_logs.py -v
